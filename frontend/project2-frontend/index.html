<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutritional Insights Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="background: #007BFF; color: white; padding: 20px; text-align: center; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; padding: 10px 40px;">
        <div style="width: 200px;"></div> 
        <h1>Nutritional Insights</h1>
        <div id="authSection">
            <a href="/login" id="loginBtn" style="background: #24292e; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                Login with GitHub
            </a>
            <a href="/logout" id="logoutBtn" style="display: none; background: #d9534f; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 0.9rem;">
                Sign Out
            </a>
        </div>
    </header>

    <main>
        <section id="chartsContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 0 20px; transition: opacity 0.5s;">
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Bar Chart</h3>
                <p style="font-size: 0.8rem; color: #666;">Average macronutrient content by diet type.</p>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Scatter Plot</h3>
                <p style="font-size: 0.8rem; color: #666;">Nutrient relationships (protein vs carbs).</p>
                <canvas id="scatterChart"></canvas>
            </div>
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Pie Chart</h3>
                <p style="font-size: 0.8rem; color: #666;">Recipe distribution by diet type.</p>
                <canvas id="pieChart"></canvas>
            </div>
        </section>

        <section style="text-align: center; margin: 40px 0;">
            <h3>Filters and Data Interaction</h3>
            <div style="margin-bottom: 20px;">
                <select id="dietFilter" style="padding: 10px; border-radius: 5px;">
                    <option value="All">All Diet Types</option>
                    <option value="Dash">Dash</option>
                    <option value="Keto">Keto</option>
                    <option value="Mediterranean">Mediterranean</option>
                    <option value="Paleo">Paleo</option>
                    <option value="Vegan">Vegan</option>
                </select>
            </div>
            
            <div class="api-buttons" style="display: flex; justify-content: center; gap: 10px;">
                <button id="getInsights" style="background: #007BFF; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Nutritional Insights</button>
                <button id="getRecipes" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Recipes</button>
                <button id="getClusters" style="background: #6f42c1; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Clusters</button>
            </div>
            <div id="executionTime" style="margin-top: 15px; font-weight: bold; color: #555;"></div>
        </section>
    </main>

    <script>
        const API_URL = "http://localhost:3000/api/analyze_data";
        let barChart, scatterChart, pieChart;

        const dietColorMap = {
            'Dash': '#FF6384',
            'Keto': '#36A2EB',
            'Mediterranean': '#FFCE56',
            'Paleo': '#4BC0C0',
            'Vegan': '#9966FF'
        };

        async function fetchAndRender(filter = "All") {
            const timeDiv = document.getElementById("executionTime");
            const container = document.getElementById("chartsContainer");
            const loginBtn = document.getElementById("loginBtn");
            const logoutBtn = document.getElementById("logoutBtn");

            timeDiv.innerText = "Verifying Security Session...";
            
            try {
                const response = await fetch(API_URL);
                
                if (response.status === 401) {
                    timeDiv.innerHTML = "⚠️ <span style='color: #d9534f;'>Access Denied: Please Login with GitHub to unlock data.</span>";
                    container.style.opacity = "0.2";
                    // Toggle buttons for logged-out state
                    loginBtn.style.display = "flex";
                    logoutBtn.style.display = "none";
                    return;
                }

                const apiData = await response.json();
                container.style.opacity = "1";
                // Toggle buttons for logged-in state
                loginBtn.style.display = "none";
                logoutBtn.style.display = "block";

                let data = Object.keys(apiData).map(diet => ({
                    name: diet.charAt(0).toUpperCase() + diet.slice(1),
                    protein: apiData[diet]["Protein(g)"] || 0,
                    carbs: apiData[diet]["Carbs(g)"] || 0,
                    fat: apiData[diet]["Fat(g)"] || 0
                }));

                if (filter !== "All") {
                    data = data.filter(d => d.name === filter);
                }

                updateCharts(data);
                timeDiv.innerText = "Security Check Passed. Data retrieved successfully.";
            } catch (error) {
                console.error(error);
                timeDiv.innerText = "Error: Python backend (app.py) is not responding.";
            }
        }

        function updateCharts(data) {
            const labels = data.map(d => d.name);
            const colors = data.map(d => dietColorMap[d.name] || '#6c757d');

            if (barChart) barChart.destroy();
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Protein (g)', data: data.map(d => d.protein), backgroundColor: colors }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            if (scatterChart) scatterChart.destroy();
            scatterChart = new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { datasets: [{ label: 'Protein vs Carbs', data: data.map(d => ({ x: d.protein, y: d.carbs })), backgroundColor: '#800080' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data: data.map(d => d.fat), backgroundColor: colors }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        document.getElementById('getInsights').addEventListener('click', () => fetchAndRender());
        document.getElementById('dietFilter').addEventListener('change', (e) => fetchAndRender(e.target.value));

        fetchAndRender();
    </script>
</body>
</html>
