<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutritional Insights Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="background: #007BFF; color: white; padding: 20px; text-align: center; margin-bottom: 20px;">
        <h1>Nutritional Insights</h1>
    </header>

    <main>
        <section id="chartsContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 0 20px;">
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Bar Chart</h3>
                <p style="font-size: 0.8rem; color: #666;">Average macronutrient content by diet type.</p>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Scatter Plot</h3>
                <p style="font-size: 0.8rem; color: #666;">Nutrient relationships (protein vs carbs).</p>
                <canvas id="scatterChart"></canvas>
            </div>
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Heatmap</h3>
                <p style="font-size: 0.8rem; color: #666;">Nutrient correlations.</p>
                <canvas id="heatmapChart"></canvas>
            </div>
            <div class="chart-card" style="background: white; padding: 15px; border-radius: 10px; width: 45%; min-width: 350px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 350px;">
                <h3>Pie Chart</h3>
                <p style="font-size: 0.8rem; color: #666;">Recipe distribution by diet type.</p>
                <canvas id="pieChart"></canvas>
            </div>
        </section>

        <section style="text-align: center; margin: 40px 0;">
            <h3>Filters and Data Interaction</h3>
            <div style="margin-bottom: 20px;">
                <input type="text" placeholder="Search by Diet Type" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                <select id="dietFilter" style="padding: 10px; border-radius: 5px;">
                    <option value="All">All Diet Types</option>
                    <option value="dash">Dash</option>
                    <option value="keto">Keto</option>
                    <option value="mediterranean">Mediterranean</option>
                    <option value="paleo">Paleo</option>
                    <option value="vegan">Vegan</option>
                </select>
            </div>
            
            <div class="api-buttons" style="display: flex; justify-content: center; gap: 10px;">
                <button id="getInsights" style="background: #007BFF; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Nutritional Insights</button>
                <button id="getRecipes" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Recipes</button>
                <button id="getClusters" style="background: #6f42c1; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Get Clusters</button>
            </div>
            <div id="executionTime" style="margin-top: 15px; font-weight: bold; color: #555;"></div>
        </section>
    </main>

    <script>
        const API_URL = "https://diet-analysis-api-v2.azurewebsites.net/api/analyze_data";
        let barChart, scatterChart, heatmapChart, pieChart;

        const dietColorMap = {
            'Dash': '#FF6384',
            'Keto': '#36A2EB',
            'Mediterranean': '#FFCE56',
            'Paleo': '#4BC0C0',
            'Vegan': '#9966FF'
        };

        async function fetchAndRender(filter = "All") {
            const timeDiv = document.getElementById("executionTime");
            timeDiv.innerText = "Connecting to Azure API...";
            
            try {
                const response = await fetch(API_URL);
                const apiData = await response.json();

                let data = Object.keys(apiData).map(diet => ({
                    name: diet.charAt(0).toUpperCase() + diet.slice(1),
                    protein: apiData[diet]["Protein(g)"] || 0,
                    carbs: apiData[diet]["Carbs(g)"] || 0,
                    fat: apiData[diet]["Fat(g)"] || 0
                }));

                if (filter !== "All") {
                    data = data.filter(d => d.name.toLowerCase() === filter.toLowerCase());
                }

                updateCharts(data);
                timeDiv.innerText = "Data successfully retrieved.";
            } catch (error) {
                console.error(error);
                timeDiv.innerText = "Error: API unreachable.";
            }
        }

        function updateCharts(data) {
            const labels = data.map(d => d.name);
            const colors = data.map(d => dietColorMap[d.name] || '#6c757d');

            // Bar Chart
            if (barChart) barChart.destroy();
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Protein (g)', data: data.map(d => d.protein), backgroundColor: colors }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 150 } } }
            });

            // Scatter Chart
            if (scatterChart) scatterChart.destroy();
            scatterChart = new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { datasets: [{ label: 'Protein vs Carbs', data: data.map(d => ({ x: d.protein, y: d.carbs })), backgroundColor: '#800080' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Pie Chart
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: { labels, datasets: [{ data: data.map(d => d.fat), backgroundColor: colors }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Heatmap (Logic only if data is present)
            if (heatmapChart) heatmapChart.destroy();
            // Basic Heatmap setup logic...
        }

        // Event Listeners for your old buttons
        document.getElementById('getInsights').addEventListener('click', () => fetchAndRender());
        document.getElementById('getRecipes').addEventListener('click', () => alert("Fetching recipes..."));
        document.getElementById('getClusters').addEventListener('click', () => alert("Calculating clusters..."));
        document.getElementById('dietFilter').addEventListener('change', (e) => fetchAndRender(e.target.value));

        fetchAndRender();
    </script>
</body>
</html>
