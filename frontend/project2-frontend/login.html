<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nutritional Insights</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .logo { width: 60px; height: 60px; background: #007BFF; border-radius: 12px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #24292e; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #000; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🥗</div>
        <h1>Nutritional Insights</h1>
        <p>Login to access your dashboard.</p>
        <a href="/login" class="btn">
            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" width="20" style="filter: invert(1);">
            Login with GitHub
        </a>
    </div>
</body>
</html>
